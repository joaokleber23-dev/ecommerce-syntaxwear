<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <met name="description"
        content="Krypton One,compre os melhores tenis e sneakers online na syntaxwear. encontre modelos exclusivos,ofertas imperdiveis e frete gratis para todo o brasil.!" />
    <title>Krypton One - Presença em cada passo</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">

    <!-- Base Styles -->
    <link rel="stylesheet" href="src/css/base/variables.css">
    <link rel="stylesheet" href="src/css/base/reset.css">
    <link rel="stylesheet" href="src/css/base/base.css">
    <link rel="stylesheet" href="src/css/base/typography.css">
    <link rel="stylesheet" href="src/css/base/global.css">

    <!-- Components -->
    <link rel="stylesheet" href="src/css/components/buttons.css">
    <link rel="stylesheet" href="src/css/components/cards.css">
    <link rel="stylesheet" href="src/css/components/container.css">
    <link rel="stylesheet" href="src/css/layout/product-category.css">

    <!-- Layout -->
    <link rel="stylesheet" href="src/css/layout/header.css">
    <link rel="stylesheet" href="src/css/layout/hero.css">
    <link rel="stylesheet" href="src/css/layout/destaque.css">
    <link rel="stylesheet" href="src/css/layout/footer.css">
    <link rel="stylesheet" href="src/css/layout/products-grid.css">

    <!-- Pages -->
    <link rel="stylesheet" href="src/css/pages/home.css">

    <!-- Responsive -->
    <link rel="stylesheet" href="src/css/responsive.css">

</head>

<body>

    <header class="menu">
        <nav class="navbar">
            <div class="navbar-logo">
                <a href="#" class="logo">
                    <img src="./src/assets/images/logo/Logo.svg" alt="Krypton One" />
                </a>
            </div>

            <div class="navbar-center">
                <ul>
                    <li><a href="#">Masculino</a></li>
                    <li><a href="#">Feminino</a></li>
                    <li><a href="#">Outlet</a></li>
                </ul>
            </div>

            <div class="navbar-right">
                <ul>
                    <li><a href="#">Nossas lojas</a></li>
                    <li><a href="#">Sobre</a></li>
                    <li><a href="#" class="icon-user">
                            <img src="./src/assets/images/icons/ícone.svg" alt="Usuário" />
                        </a></li>
                    <li><a href="#" class="icon-help">
                            <img src="./src/assets/images/icons/Vector (1).svg" alt="Ajuda" />
                        </a></li>
                    <li><a href="#" class="icon-cart">
                            <img src="./src/assets/images/icons/ícone (1).svg" alt="Carrinho" />
                        </a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="hero-overlay">
                <div class="hero-content">
                    <span class="hero-subtitle">Krypton One</span>
                    <h2 class="hero-title">Transforme qualquer passo em presença</h2>
                    <div class="hero-buttons">
                        <a class="btn btn-outline" href="#">Ver Modelos</a>
                        <a class="btn btn-filled" href="#">Comprar</a>
                    </div>
                </div>
            </div>

        </section>

        <section class="categories-section">
            <div class="category-card casual">
                <a href="#" class="category-link">
                    <span class="overlay"></span>
                    <span class="category-name  btn btn-outline">casual</span>
                </a>
            </div>

            <div class="category-card esporte">
                <a href="#">
                    <span class="overlay"></span>
                    <span class="category-name  btn btn-outline">esporte</span>
                </a>
            </div>
            <div class="category-card colorido">
                <a href="#">
                    <span class="overlay"></span>
                    <span class="category-name  btn btn-outline">colorido</span>
                </a>
            </div>
            <div class="category-card futurista">
                <a href="#">
                    <span class="overlay"></span>
                    <span class="category-name  btn btn-outline">futurista</span>
                </a>
            </div>

        </section>
    </main>

    <footer>
        <h2>Inscreva-se em nosso e-mail</h2>
        <form>
            <label for="email">Receba novidades e promoções:</label>
            <input type="email" id="email" placeholder="email@email.com">
            <button type="submit">Enviar</button>
        </form>
    </footer>

</body>

</html>
