<!DOCTYPE html>
<html lang="pt-br"> <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Krypton One - Presença em cada passo</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="src/css/layout/header.css">
</head>
<body>

    <header class="menu">
        <nav class="navbar">
            <div class="navbar-left">
                <ul>
                    <li><a href="#">Nossas lojas</a></li>
                    <li><a href="#">Sobre</a></li>
                </ul>
            </div>
            
            <div class="navbar-center">
                <ul>
                    <li><a href="#">Masculino</a></li>
                    <li><a href="#">Feminino</a></li>
                    <li><a href="#">Outlet</a></li>
                </ul>
            </div>

            <div class="navbar-right">
                <ul>
                    <li><a href="#" class="icon-user" title="Minha conta">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </a></li>
                    <li><a href="#" class="icon-notifications" title="Notificações">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                        </svg>
                    </a></li>
                    <li><a href="#" class="icon-cart" title="Carrinho">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="9" cy="21" r="1"></circle>
                            <circle cx="20" cy="21" r="1"></circle>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                        </svg>
                    </a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>Krypton one</h1>
            <h2>Transforme qualquer passo em presença</h2>
            <div class="botoes">
                <button>Ver Modelos</button>
                <button>Comprar</button>
            </div>
        </section>

        <section class="vitrine">
            <div class="tenis branco">
                <h3>Um tênis ideal para o seu dia a dia.</h3>
                <button>Casual</button>
            </div>

            <div class="tenis preto">
                <h3>Ideal para o dia a dia e prática de esportes.</h3>
                <button>Esporte</button>
            </div>
            </section>

        <section class="galeria">
            <p>Krypton One</p>
            <h1>Estilo Urbano com Atitude</h1>
            <div class="fotos">
                <img src="foto1.jpg" alt="Tênis Krypton em ambiente urbano">
                <img src="foto2.jpg" alt="Detalhe do solado">
                </div>
        </section>
    </main>

    <footer>
        <h2>Inscreva-se em nosso e-mail</h2>
        <form>
            <label for="email">Receba novidades e promoções:</label>
            <input type="email" id="email" placeholder="email@email.com">
            <button type="submit">Enviar</button>
        </form>
    </footer>

</body>
</html>
